name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# O GITHUB_TOKEN só lê o repositório (nenhum job publica nada).
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Testes de integração contra PostgreSQL de verdade (Testcontainers usa o Docker do runner).
      # Falha se a cobertura cair abaixo de 90% das linhas / 85% dos branches.
      - name: Build, Test and Coverage check (JaCoCo)
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test and Coverage check (Vitest)
        run: npm run coverage
      - name: Production build
        run: npm run build
