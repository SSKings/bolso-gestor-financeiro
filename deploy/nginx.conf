# nginx de produção: TLS, cabeçalhos de segurança, SPA e proxy de /api (mesma origem). Imagem sem root: 8080/8443.

# Limite por IP na borda (a API também limita, por instância)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

server_tokens off;

server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # perfil "intermediate" da Mozilla; sem session tickets (sigilo futuro)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;
    root /usr/share/nginx/html;
    include /etc/nginx/conf.d/security-headers.inc;

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: rotas do React caem no index.html (sem cache, para a versão nova chegar)
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # rotas sem login (e o aceite de convite): limite rígido contra força bruta
    location ~ ^/api/(auth/(login|register)|invites/[^/]+/accept)$ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    # health da API não sai para a internet (o compose checa por dentro)
    location /actuator/ { return 404; }
}
