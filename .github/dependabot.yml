# Atualizações automáticas de dependências. minor/patch agrupadas; major ignorada (exige migração planejada).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups: { maven-minor-patch: { update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: npm
    directories: [/frontend, /frontend/tools/openapi]
    schedule: { interval: weekly }
    groups: { npm-minor-patch: { update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    groups: { docker-minor-patch: { update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: docker-compose
    directories: [/deploy, /backend]
    schedule: { interval: weekly }
    groups: { compose-minor-patch: { update-types: [minor, patch] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
